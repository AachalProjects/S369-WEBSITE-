<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5d1f2d">
  <title>Account — S369 Perfume | Signature Eau de Parfum</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:,">

  <style>
    :root {
      --wine: #5d1f2d;
      --wine-dark: #3e121c;
      --wine-light: #7c2e3f;
      --cream: #fbf9f5;
      --gold: #c5a059;
      --text: #1a1a1a;
      --muted: #767676;
      --border: #e6dfd5;
      --transition-smooth: all 0.25s ease;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #f7f3ed 0%, #ede6db 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    .auth-page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 60px;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid rgba(230, 223, 213, 0.95);
      border-radius: 16px;
      padding: 38px 34px;
      box-shadow: 0 16px 40px rgba(93, 31, 45, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--wine), var(--gold), var(--wine));
      border-radius: 16px 16px 0 0;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo-img {
      height: 44px;
      margin-bottom: 12px;
    }

    .auth-header h1 {
      font-size: 26px;
      font-weight: 500;
      color: var(--wine-dark);
      margin-bottom: 6px;
      font-family: var(--serif, serif);
    }

    .auth-header p {
      font-size: 13.5px;
      color: var(--muted);
      margin: 0;
    }

    /* DIRECT ROBUST TAB BUTTONS */
    .auth-tabs {
      display: flex;
      gap: 10px;
      background: #f5ede2;
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 26px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #dcd3c7;
      background: #fdfbf9;
      font-size: 14.5px;
      font-weight: 600;
      color: #555555;
      cursor: pointer !important;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-align: center;
      text-decoration: none !important;
      display: inline-block;
      outline: none;
      user-select: none;
      box-sizing: border-box;
    }

    .auth-tab-btn:hover {
      color: #111;
      border-color: #5d1f2d;
      background: #f9f5f0;
    }

    .auth-tab-btn.active {
      background: #5d1f2d !important;
      color: #ffffff !important;
      border-color: #5d1f2d !important;
      box-shadow: 0 4px 12px rgba(93, 31, 45, 0.25);
    }

    /* INPUTS */
    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #333;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 44px 13px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #faf8f5;
      color: var(--text);
      transition: var(--transition-smooth);
      outline: none;
      box-sizing: border-box;
    }

    .input-wrapper input:focus {
      background: #fff;
      border-color: var(--wine);
      box-shadow: 0 0 0 3px rgba(93, 31, 45, 0.12);
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      color: #777;
      padding: 8px;
      font-size: 16px;
      line-height: 1;
    }

    .form-extras {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-top: -2px;
      margin-bottom: 22px;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #555;
    }

    .remember-wrap input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--wine);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--wine);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* SUBMIT BUTTON */
    .auth-submit-btn {
      width: 100%;
      padding: 15px 20px;
      background: #5d1f2d !important;
      color: #ffffff !important;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer !important;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(93, 31, 45, 0.25);
    }

    .auth-submit-btn:hover {
      background: #7c2e3f !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(93, 31, 45, 0.35);
    }

    .auth-submit-btn:active {
      transform: translateY(0);
    }

    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .auth-submit-btn.loading .btn-spinner {
      display: inline-block;
    }

    .auth-feedback {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      min-height: 22px;
      line-height: 1.4;
    }

    .auth-feedback.error {
      color: #b00020;
      font-weight: 600;
    }

    .auth-feedback.success {
      color: #1b5e20;
      font-weight: 600;
    }

    .switch-toggle-note {
      text-align: center;
      margin-top: 18px;
      font-size: 13.5px;
      color: #666;
    }

    .switch-toggle-btn {
      background: none;
      border: none;
      color: var(--wine);
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      font-size: 13.5px;
      padding: 0 4px;
    }

    .auth-footer-links {
      text-align: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 13.5px;
      color: #777;
    }

    .auth-footer-links a {
      color: var(--wine);
      text-decoration: none;
      font-weight: 500;
    }

    @media (max-width: 520px) {
      .auth-card {
        padding: 28px 20px;
      }
    }
  </style>

  <!-- GUARANTEED GLOBAL TAB SWITCHER & PASSWORD VISIBILITY SCRIPT -->
  <script>
    window.togglePasswordVisibility = function(fieldId, btn) {
      var field = document.getElementById(fieldId);
      if (!field) return;
      var eyeOpen = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      var eyeSlash = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      if (field.type === "password") {
        field.type = "text";
        if (btn) {
          btn.innerHTML = eyeSlash;
          btn.setAttribute("aria-label", "Hide password");
          btn.setAttribute("title", "Hide password");
        }
      } else {
        field.type = "password";
        if (btn) {
          btn.innerHTML = eyeOpen;
          btn.setAttribute("aria-label", "Show password");
          btn.setAttribute("title", "Show password");
        }
      }
    };

    window.switchTab = function(tab) {
      console.log("Switching tab to:", tab);
      var loginForm = document.getElementById("loginForm");
      var registerForm = document.getElementById("registerForm");
      var loginBtn = document.getElementById("loginTabBtn");
      var registerBtn = document.getElementById("registerTabBtn");
      var title = document.getElementById("authTitle");
      var subtitle = document.getElementById("authSubtitle");

      var loginFeedback = document.getElementById("loginFeedback");
      var registerFeedback = document.getElementById("registerFeedback");
      if (loginFeedback) loginFeedback.innerHTML = "";
      if (registerFeedback) registerFeedback.innerHTML = "";

      if (tab === "register") {
        if (loginForm) loginForm.style.setProperty("display", "none", "important");
        if (registerForm) registerForm.style.setProperty("display", "block", "important");
        if (loginBtn) loginBtn.classList.remove("active");
        if (registerBtn) registerBtn.classList.add("active");
        if (title) title.textContent = "Create an Account";
        if (subtitle) subtitle.textContent = "Join S369 for order tracking, fast checkout & perks";
      } else {
        if (loginForm) loginForm.style.setProperty("display", "block", "important");
        if (registerForm) registerForm.style.setProperty("display", "none", "important");
        if (loginBtn) loginBtn.classList.add("active");
        if (registerBtn) registerBtn.classList.remove("active");
        if (title) title.textContent = "Welcome to S369";
        if (subtitle) subtitle.textContent = "Sign in or create an account to manage your signature scents";
      }
    };
  </script>
</head>

<body>
  <!-- HEADER -->
  <div data-header></div>

  <!-- AUTH MAIN -->
  <main class="auth-page-wrapper">
    <div class="auth-card" id="authCard">
      
      <!-- LOGO & BRAND HEAD -->
      <div class="auth-header">
        <img class="auth-logo-img" src="assets/images/brand/logo-red.png" alt="S369 Perfume Logo">
        <h1 id="authTitle">Welcome to S369</h1>
        <p id="authSubtitle">Sign in or create an account to manage your signature scents</p>
      </div>

      <!-- NOTICE IF ALREADY LOGGED IN -->
      <div id="alreadyLoggedInNotice" style="display:none; margin-bottom: 20px; padding: 12px 14px; background: #fdf5ea; border: 1px solid #ebdccb; border-radius: 8px; font-size: 13.5px; text-align: center;"></div>

      <!-- TABS -->
      <div class="auth-tabs" id="tabContainer">
        <a href="login.html" class="auth-tab-btn active" id="loginTabBtn" onclick="if(window.switchTab){ window.switchTab('login'); return false; }">
          Sign In
        </a>
        <a href="register.html" class="auth-tab-btn" id="registerTabBtn" onclick="if(window.switchTab){ window.switchTab('register'); return false; }">
          Create Account
        </a>
      </div>

      <!-- ================= LOGIN FORM ================= -->
      <form id="loginForm" style="display: block;" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="loginEmail" placeholder="name@example.com" autocomplete="email">
          </div>
        </div>

        <div class="input-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Toggle password view" title="Toggle password view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-extras">
          <label class="remember-wrap">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">
          <span class="btn-spinner"></span>
          <span class="btn-text">Sign In</span>
        </button>

        <div id="loginFeedback" class="auth-feedback" aria-live="polite"></div>

        <p class="switch-toggle-note">
          New to S369?
          <a href="register.html" class="switch-toggle-btn" onclick="if(window.switchTab){ window.switchTab('register'); return false; }">Create an Account</a>
        </p>
      </form>

      <!-- ================= REGISTER FORM ================= -->
      <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
        <div class="input-group">
          <label for="registerName">Full Name</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="registerName"
              placeholder="e.g. Aachal Sharma"
              autocomplete="name"
              required
              pattern="^[A-Za-z\s]{2,50}$"
              title="Full Name must contain only letters and spaces (min 2 characters)"
              oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"
            >
          </div>
        </div>

        <div class="input-group">
          <label for="registerEmail">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="registerEmail" placeholder="name@example.com" autocomplete="email">
          </div>
        </div>

        <div class="input-group">
          <label for="registerPassword">Create Password</label>
          <div class="input-wrapper">
            <input type="password" id="registerPassword" placeholder="At least 6 characters" autocomplete="new-password">
            <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('registerPassword', this)" aria-label="Toggle password view" title="Toggle password view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-extras">
          <label class="remember-wrap">
            <input type="checkbox" id="registerTerms" checked>
            <span>I accept the <a href="policies.html#terms" target="_blank" style="color:var(--wine); font-weight:600;">Terms & Policies</a></span>
          </label>
        </div>

        <button type="submit" class="auth-submit-btn" id="registerSubmitBtn">
          <span class="btn-spinner"></span>
          <span class="btn-text">Create Account</span>
        </button>

        <div id="registerFeedback" class="auth-feedback" aria-live="polite"></div>

        <p class="switch-toggle-note">
          Already have an account?
          <a href="login.html" class="switch-toggle-btn" onclick="if(window.switchTab){ window.switchTab('login'); return false; }">Sign In</a>
        </p>
      </form>

      <!-- BOTTOM NAVIGATION -->
      <div class="auth-footer-links">
        <a href="index.html">← Boutique Home</a> · <a href="shop.html">Shop Fragrances</a>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <div data-footer></div>

  <!-- SCRIPTS -->
  <script src="assets/js/config.js?v=2.2"></script>
  <script src="assets/js/products.js?v=2.2"></script>
  <script src="assets/js/store.js?v=2.2"></script>

  <script>
    // Initialize Site Navigation Chrome
    try {
      if (window.S369 && S369.globalChrome) S369.globalChrome("login");
    } catch(e) {
      console.warn("Global chrome error:", e);
    }

    window.API_BASE = window.API_BASE || "http://localhost:5000";
    window.CREDENTIALS_MODE = window.location.protocol === "file:" ? "same-origin" : "include";

    // Bind forms & tabs in DOMContentLoaded
    document.addEventListener("DOMContentLoaded", async function() {
      var regBtn = document.getElementById("registerTabBtn");
      var logBtn = document.getElementById("loginTabBtn");
      if (regBtn) regBtn.addEventListener("click", function(e) { e.preventDefault(); window.switchTab("register"); });
      if (logBtn) logBtn.addEventListener("click", function(e) { e.preventDefault(); window.switchTab("login"); });

      var loginFm = document.getElementById("loginForm");
      var registerFm = document.getElementById("registerForm");
      if (loginFm) loginFm.addEventListener("submit", window.handleLogin);
      if (registerFm) registerFm.addEventListener("submit", window.handleRegister);

      var urlParams = new URLSearchParams(window.location.search);
      if (window.location.hash === "#register" || urlParams.get("tab") === "register") {
        window.switchTab("register");
      }

      // Check current session
      try {
        if (window.S369 && S369.checkAuthSession) {
          var existingUser = await S369.checkAuthSession();
          if (existingUser) {
            var redirectUrl = urlParams.get("redirect");
            if (redirectUrl) {
              window.location.href = redirectUrl;
              return;
            }
            var notice = document.getElementById("alreadyLoggedInNotice");
            if (notice) {
              notice.style.display = "block";
              notice.innerHTML = `Signed in as <strong>${existingUser.name}</strong> (${existingUser.email}). <a href="account.html" style="color:var(--wine); font-weight:600; text-decoration:underline;">View Account</a> or <a href="#" onclick="handleLogoutOnLoginPage(event)" style="color:#b00020; margin-left:8px; text-decoration:underline;">Sign Out</a>`;
            }
          }
        }
      } catch (e) {
        console.debug("Session check:", e);
      }
    });

    window.handleLogoutOnLoginPage = async function(e) {
      if (e) e.preventDefault();
      try {
        await fetch(`${window.API_BASE}/api/auth/logout`, { method: "POST", credentials: window.CREDENTIALS_MODE });
      } catch (err) {}
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      var notice = document.getElementById("alreadyLoggedInNotice");
      if (notice) notice.style.display = "none";
      if (window.S369 && S369.toast) S369.toast("Signed out successfully.");
    };

    window.setBtnLoading = function(btn, loading) {
      if (!btn) return;
      if (loading) {
        btn.disabled = true;
        btn.classList.add("loading");
      } else {
        btn.disabled = false;
        btn.classList.remove("loading");
      }
    };

    window.handleLogin = async function(e) {
      if (e) e.preventDefault();
      var emailEl = document.getElementById("loginEmail");
      var passEl = document.getElementById("loginPassword");
      var feedback = document.getElementById("loginFeedback");
      var submitBtn = document.getElementById("loginSubmitBtn");

      var email = (emailEl ? emailEl.value : "").trim();
      var password = passEl ? passEl.value : "";

      if (feedback) {
        feedback.className = "auth-feedback";
        feedback.innerHTML = "";
      }

      if (!email || !password) {
        if (feedback) {
          feedback.className = "auth-feedback error";
          feedback.textContent = "Please provide both email and password.";
        }
        return;
      }

      window.setBtnLoading(submitBtn, true);

      try {
        var response = await fetch(`${window.API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: window.CREDENTIALS_MODE,
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Invalid credentials.");
        }

        if (data.token) localStorage.setItem("token", data.token);
        if (data.user) localStorage.setItem("user", JSON.stringify(data.user));

        if (feedback) {
          feedback.className = "auth-feedback success";
          feedback.textContent = "Signed in successfully. Syncing your bag…";
        }

        if (window.S369 && S369.syncCartWithServer) {
          await S369.syncCartWithServer();
        }
        if (window.S369 && S369.syncWishlistWithServer) {
          await S369.syncWishlistWithServer();
        }

        var urlParams = new URLSearchParams(window.location.search);
        var redirectUrl = urlParams.get("redirect") || (data.user && data.user.role === "admin" ? "admin.html" : "index.html");

        setTimeout(function() {
          window.location.href = redirectUrl;
        }, 600);

      } catch (err) {
        console.error("Login error:", err);
        if (feedback) {
          feedback.className = "auth-feedback error";
          feedback.textContent = err.message || "Cannot connect to server. Ensure backend is running.";
        }
      } finally {
        window.setBtnLoading(submitBtn, false);
      }
    };

    window.handleRegister = async function(e) {
      if (e) e.preventDefault();
      var nameEl = document.getElementById("registerName");
      var emailEl = document.getElementById("registerEmail");
      var passEl = document.getElementById("registerPassword");
      var termsEl = document.getElementById("registerTerms");
      var feedback = document.getElementById("registerFeedback");
      var submitBtn = document.getElementById("registerSubmitBtn");

      var name = (nameEl ? nameEl.value : "").trim();
      var email = (emailEl ? emailEl.value : "").trim();
      var password = passEl ? passEl.value : "";
      var terms = termsEl ? termsEl.checked : false;

      if (feedback) {
        feedback.className = "auth-feedback";
        feedback.innerHTML = "";
      }

      if (!name) {
        if (feedback) {
          feedback.className = "auth-feedback error";
          feedback.textContent = "Please enter your full name.";
        }
        if (nameEl) nameEl.focus();
        return;
      }

      if (!email || !email.includes("@")) {
        if (feedback) {
          feedback.className = "auth-feedback error";
          feedback.textContent = "Please enter a valid email address.";
        }
        if (emailEl) emailEl.focus();
        return;
      }

      if (!password || password.length < 6) {
        if (feedback) {
          feedback.className = "auth-feedback error";
          feedback.textContent = "Password must be at least 6 characters long.";
        }
        if (passEl) passEl.focus();
        return;
      }

      if (!terms) {
        if (feedback) {
          feedback.className = "auth-feedback error";
          feedback.textContent = "Please accept the Terms & Policies to continue.";
        }
        return;
      }

      window.setBtnLoading(submitBtn, true);
      setTimeout(function() { window.setBtnLoading(submitBtn, false); }, 5000);

      try {
        var response = await fetch(`${window.API_BASE}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: window.CREDENTIALS_MODE,
          body: JSON.stringify({ name: name, email: email, password: password })
        });

        var data = await response.json();

        if (!response.ok) {
          if (data.message && data.message.toLowerCase().includes("already registered")) {
            if (feedback) {
              feedback.className = "auth-feedback error";
              feedback.innerHTML = `This email is already registered. <button type="button" class="switch-toggle-btn" onclick="window.switchTab('login'); var le=document.getElementById('loginEmail'); if(le) le.value='${email}';">Click to Sign In</button>`;
            }
            return;
          }
          throw new Error(data.message || "Registration failed.");
        }

        if (data.token) localStorage.setItem("token", data.token);
        if (data.user) localStorage.setItem("user", JSON.stringify(data.user));

        if (feedback) {
          feedback.className = "auth-feedback success";
          feedback.textContent = "Account created! Welcome to S369 Perfume.";
        }

        if (window.S369 && S369.syncCartWithServer) {
          await S369.syncCartWithServer();
        }
        if (window.S369 && S369.syncWishlistWithServer) {
          await S369.syncWishlistWithServer();
        }

        var urlParams = new URLSearchParams(window.location.search);
        var redirectUrl = urlParams.get("redirect") || "index.html";

        setTimeout(function() {
          window.location.href = redirectUrl;
        }, 700);

      } catch (err) {
        console.error("Register error:", err);
        if (feedback) {
          feedback.className = "auth-feedback error";
          feedback.textContent = err.message || "Unable to complete registration. Please try again.";
        }
      } finally {
        window.setBtnLoading(submitBtn, false);
      }
    };
  </script>
</body>
</html>
