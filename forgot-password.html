<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5d1f2d">
  <title>Reset Password — S369 Perfume | Signature Eau de Parfum</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:,">

  <style>
    :root {
      --wine: #5d1f2d;
      --wine-dark: #3e121c;
      --wine-light: #7c2e3f;
      --gold: #c5a059;
      --text: #1a1a1a;
      --muted: #767676;
      --border: #e6dfd5;
      --transition-smooth: all 0.25s ease;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #f7f3ed 0%, #ede6db 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    .auth-page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 60px;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid rgba(230, 223, 213, 0.95);
      border-radius: 16px;
      padding: 38px 34px;
      box-shadow: 0 16px 40px rgba(93, 31, 45, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--wine), var(--gold), var(--wine));
      border-radius: 16px 16px 0 0;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo-img {
      height: 44px;
      margin-bottom: 12px;
    }

    .auth-header h1 {
      font-size: 26px;
      font-weight: 500;
      color: var(--wine-dark);
      margin-bottom: 6px;
      font-family: var(--serif, serif);
    }

    .auth-header p {
      font-size: 13.5px;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #333;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #faf8f5;
      color: var(--text);
      transition: var(--transition-smooth);
      outline: none;
      box-sizing: border-box;
    }

    .input-wrapper input:focus {
      background: #fff;
      border-color: var(--wine);
      box-shadow: 0 0 0 3px rgba(93, 31, 45, 0.12);
    }

    .otp-inputs {
      letter-spacing: 6px;
      font-size: 22px !important;
      text-align: center;
      font-weight: 700;
      font-family: monospace;
    }

    .auth-submit-btn {
      width: 100%;
      padding: 15px 20px;
      background: #5d1f2d !important;
      color: #ffffff !important;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer !important;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(93, 31, 45, 0.25);
      margin-top: 10px;
    }

    .auth-submit-btn:hover {
      background: #7c2e3f !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(93, 31, 45, 0.35);
    }

    .auth-feedback {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
      min-height: 22px;
      line-height: 1.4;
    }

    .auth-feedback.error {
      color: #b00020;
      font-weight: 600;
    }

    .auth-feedback.success {
      color: #1b5e20;
      font-weight: 600;
    }

    .auth-footer-links {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 13.5px;
      color: #777;
    }

    .auth-footer-links a {
      color: var(--wine);
      text-decoration: none;
      font-weight: 600;
    }

    .step-badge {
      display: inline-block;
      background: #f4ece0;
      color: var(--wine);
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div data-header></div>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img class="auth-logo-img" src="assets/images/brand/logo-red.png" alt="S369 Perfume Logo">
        <h1>Password Assistance</h1>
        <p id="subheading">Enter your registered email to receive a secure 6-digit verification code</p>
      </div>

      <!-- STEP 1: REQUEST OTP -->
      <form id="step1Form" onsubmit="handleRequestOtp(event)">
        <div style="text-align:center;">
          <span class="step-badge">Step 1 of 2</span>
        </div>

        <div class="input-group">
          <label for="resetEmail">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="resetEmail" placeholder="name@example.com" autocomplete="email" required autofocus>
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" id="btnRequestOtp">
          Send Verification Code
        </button>

        <div id="step1Feedback" class="auth-feedback"></div>
      </form>

      <!-- STEP 2: VERIFY OTP & ENTER NEW PASSWORD -->
      <form id="step2Form" style="display: none;" onsubmit="handleResetPassword(event)">
        <div style="text-align:center;">
          <span class="step-badge">Step 2 of 2</span>
        </div>

        <div class="input-group">
          <label for="otpCode">6-Digit Verification Code</label>
          <div class="input-wrapper">
            <input type="text" id="otpCode" class="otp-inputs" placeholder="••••••" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
          </div>
          <small style="display:block; margin-top:4px; font-size:12px; color:#777; text-align:center;">Check your email inbox for the 6-digit code</small>
        </div>

        <div class="input-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="newPassword" placeholder="Minimum 6 characters" required autocomplete="new-password">
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" id="btnResetPassword">
          Update Password & Sign In
        </button>

        <div id="step2Feedback" class="auth-feedback"></div>

        <p style="text-align:center; margin-top:16px; font-size:13px; color:#666;">
          Didn't receive the email? <button type="button" onclick="resendOtp()" style="background:none; border:none; color:var(--wine); font-weight:700; cursor:pointer; text-decoration:underline;">Resend Code</button>
        </p>
      </form>

      <div class="auth-footer-links">
        <a href="login.html">← Back to Sign In</a> · <a href="shop.html">Shop Fragrances</a>
      </div>
    </div>
  </main>

  <div data-footer></div>

  <!-- SCRIPTS -->
  <script src="assets/js/config.js?v=2.2"></script>
  <script src="assets/js/products.js?v=2.2"></script>
  <script src="assets/js/store.js?v=2.2"></script>

  <script>
    if (window.S369 && S369.globalChrome) {
      try { S369.globalChrome("login"); } catch(e) {}
    }

    window.API_BASE = window.API_BASE || "http://localhost:5000";
    let targetEmail = "";

    async function handleRequestOtp(e) {
      if (e) e.preventDefault();
      const email = (document.getElementById("resetEmail").value || "").trim();
      const feedback = document.getElementById("step1Feedback");
      const btn = document.getElementById("btnRequestOtp");

      feedback.className = "auth-feedback";
      feedback.textContent = "";

      if (!email || !email.includes("@")) {
        feedback.className = "auth-feedback error";
        feedback.textContent = "Please enter a valid email address.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending code via SMTP…";

      try {
        const res = await fetch(`${window.API_BASE}/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.message || "Failed to send reset code.");
        }

        targetEmail = email;
        feedback.className = "auth-feedback success";
        feedback.textContent = `Verification code dispatched to ${email}!`;

        setTimeout(() => {
          document.getElementById("step1Form").style.display = "none";
          document.getElementById("step2Form").style.display = "block";
          document.getElementById("subheading").textContent = `Code sent to ${email}. Enter code below to set your new password.`;
          document.getElementById("otpCode").focus();
        }, 800);

      } catch (err) {
        feedback.className = "auth-feedback error";
        feedback.textContent = err.message || "Could not send verification code. Ensure server is running.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Send Verification Code";
      }
    }

    async function handleResetPassword(e) {
      if (e) e.preventDefault();
      const otp = (document.getElementById("otpCode").value || "").trim();
      const newPassword = document.getElementById("newPassword").value || "";
      const confirmPassword = document.getElementById("confirmPassword").value || "";
      const feedback = document.getElementById("step2Feedback");
      const btn = document.getElementById("btnResetPassword");

      feedback.className = "auth-feedback";
      feedback.textContent = "";

      if (!otp || otp.length !== 6) {
        feedback.className = "auth-feedback error";
        feedback.textContent = "Please enter the 6-digit verification code.";
        return;
      }

      if (newPassword.length < 6) {
        feedback.className = "auth-feedback error";
        feedback.textContent = "Password must be at least 6 characters long.";
        return;
      }

      if (newPassword !== confirmPassword) {
        feedback.className = "auth-feedback error";
        feedback.textContent = "Passwords do not match.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Updating password in MongoDB…";

      try {
        const res = await fetch(`${window.API_BASE}/api/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: targetEmail,
            otp,
            newPassword
          })
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.message || "Password reset failed.");
        }

        feedback.className = "auth-feedback success";
        feedback.textContent = "Password successfully updated! Redirecting to Sign In…";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);

      } catch (err) {
        feedback.className = "auth-feedback error";
        feedback.textContent = err.message || "Invalid or expired verification code.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Update Password & Sign In";
      }
    }

    function resendOtp() {
      document.getElementById("step2Form").style.display = "none";
      document.getElementById("step1Form").style.display = "block";
      document.getElementById("step1Feedback").textContent = "";
      document.getElementById("btnRequestOtp").focus();
    }
  </script>
</body>
</html>
