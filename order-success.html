<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#5d1f2d" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" href="data:," />
    <title>Order Confirmed | S369 Perfume</title>
  </head>
  <body>
    <div data-header></div>
    <main class="page-wrap">
      <section class="success">
        <div class="success-mark">✓</div>
        <p class="eyebrow">ORDER PLACED SUCCESSFULLY</p>
        <h1>Thank you for choosing S369.</h1>
        <p>Your fragrance order has been confirmed. Please save your order ID for tracking and delivery support.</p>
        
        <div class="order-box" id="successBox" style="margin: 25px 0;"></div>

        <div class="button-row" style="justify-content:center; gap: 15px; display: flex;">
          <a class="btn btn-dark" href="shop.html">Continue Shopping</a>
          <a class="btn btn-outline-dark" id="trackLink" href="track-order.html">Track Order Status</a>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/store.js"></script>
    <script>
      S369.globalChrome('');
      const q = new URLSearchParams(location.search);
      const id = q.get('order') || sessionStorage.getItem('s369_last_order');
      const method = q.get('method') || '';

      const successBox = document.getElementById('successBox');
      const trackLink = document.getElementById('trackLink');

      if (id) {
        successBox.innerHTML = `
          <div><span>Order ID</span><strong>${id}</strong></div>
          <div><span>Payment Method</span><strong>${method === 'cod' ? 'Cash on Delivery (COD)' : 'Online Payment (Razorpay)'}</strong></div>
          <div><span>Payment Status</span><strong>${method === 'cod' ? 'Pending (Pay at delivery)' : 'Paid & Verified'}</strong></div>
          <div><span>Order Status</span><strong>Placed & Processing</strong></div>
        `;
        trackLink.href = 'track-order.html?order=' + encodeURIComponent(id);
      } else {
        successBox.innerHTML = '<p>No recent order was found.</p>';
      }
    </script>
  </body>
</html>
