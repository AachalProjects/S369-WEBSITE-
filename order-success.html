<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#5d1f2d" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" href="data:," />
    <title>Order Confirmed | S369 Perfume</title>
  </head>
  <body>
    <div data-header></div>
    <main class="page-wrap">
      <section class="success">
        <div class="success-mark">✓</div>
        <p class="eyebrow">ORDER PLACED SUCCESSFULLY</p>
        <h1>Thank you for choosing S369.</h1>
        <p>Your fragrance order has been confirmed. Please save your order ID for tracking and delivery support.</p>
        
        <div class="order-box" id="successBox" style="margin: 25px 0;"></div>

        <div class="button-row" style="justify-content:center; gap: 15px; display: flex; flex-wrap: wrap;">
          <a class="btn btn-dark" id="invoiceBtn" target="_blank" href="#" style="background:#5d1f2d; color:#fff;">📄 View & Print Tax Invoice</a>
          <a class="btn btn-outline-dark" id="trackLink" href="track-order.html">Track Order Status</a>
          <a class="btn btn-outline-dark" href="account.html">My Account & Orders</a>
          <a class="btn btn-outline-dark" href="shop.html">Continue Shopping</a>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/store.js"></script>
    <script>
      S369.globalChrome('');
      const q = new URLSearchParams(location.search);
      const id = q.get('order') || sessionStorage.getItem('s369_last_order');
      const method = q.get('method') || '';

      const successBox = document.getElementById('successBox');
      const trackLink = document.getElementById('trackLink');
      const invoiceBtn = document.getElementById('invoiceBtn');

      if (id) {
        successBox.innerHTML = `
          <div><span>Order ID</span><strong>${id}</strong></div>
          <div><span>Payment Method</span><strong>Online Payment (Razorpay Live)</strong></div>
          <div><span>Payment Status</span><strong style="color:#1b5e20;">Paid & Verified (Tax Invoice Emailed)</strong></div>
          <div><span>Order Status</span><strong>Placed & In Preparation</strong></div>
          <div><span>Digital Invoice</span><strong><a href="http://localhost:5000/api/orders/${encodeURIComponent(id)}/invoice" target="_blank" style="color:#5d1f2d; text-decoration:underline; font-weight:700;">Download Official Tax Invoice</a></strong></div>
        `;
        if (trackLink) trackLink.href = 'track-order.html?order=' + encodeURIComponent(id);
        if (invoiceBtn) invoiceBtn.href = 'http://localhost:5000/api/orders/' + encodeURIComponent(id) + '/invoice';
      } else {
        successBox.innerHTML = '<p>No recent order was found.</p>';
        if (invoiceBtn) invoiceBtn.style.display = 'none';
      }
    </script>
  </body>
</html>
